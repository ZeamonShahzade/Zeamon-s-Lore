name: Build Zaimon APK (Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'buildozer.spec'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install system dependencies (Removed ant and openjdk, handled by setup-java and gradle)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip python3-venv \
            build-essential autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      # 3. Configure Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Verify Java
      - name: Verify Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      # 5. Cache Android SDK/NDK only (Saves ~2GB of cache space and speeds up builds)
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.buildozer/android/app
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 6. Install Buildozer using a virtual environment (Fixes Ubuntu 22.04 pip errors)
      - name: Install Buildozer
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install buildozer "cython==0.29.33"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # 7. Build Android APK
      - name: Build APK
        run: |
          source .venv/bin/activate
          export PATH="$JAVA_HOME/bin:$PATH"
          buildozer -v android debug

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaimon-Android-APK
          path: bin/*.apk
          retention-days: 14
          if-no-files-found: error
