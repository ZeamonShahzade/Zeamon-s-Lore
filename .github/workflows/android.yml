name: Build Zaimon APK (Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip ant \
            openjdk-17-jdk \
            python3-pip python3-venv \
            build-essential autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          java -version
          javac -version
          readlink -f "$(which java)"

      - name: Cache Buildozer and Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36

        - name: Build APK
        run: |
          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$HOME/.local/bin:/usr/bin:$PATH"
          export ANT_HOME=/usr/share/ant
          export PATH="$ANT_HOME/bin:$PATH"
          ant -version
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaimon-Android-APK
          path: bin/*.apk
          retention-days: 14
          if-no-files-found: error